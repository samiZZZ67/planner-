name: "CI Build & Test"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: "🧪 Build & Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Check out repository"
        uses: actions/checkout@v4

      - name: "⚡ Set up Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🧪 Run Vitest test suite"
        run: npm test

      - name: "🏗️ Build Next.js application"
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

