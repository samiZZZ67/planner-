# ─────────────────────────────────────────────────────────────────────────────
# NightPlanner — Automated Book Reading Delivery & Telegram Brief Scheduler
# ─────────────────────────────────────────────────────────────────────────────
#
# PURPOSE
#   Reliably trigger the NightPlanner scheduled delivery system so that daily
#   book-reading sections and morning/evening Telegram briefs are sent on time,
#   even when the Render free-tier container is sleeping.
#
# HOW IT WORKS
#   1. A lightweight GET to /health wakes the Render service from sleep.
#   2. A POST to /api/cron/books with a Bearer token triggers the authoritative
#      `runScheduledDeliveryCycle()`, which atomically processes:
#        • Overdue book publishing jobs  → Telegram delivery
#        • Scheduled custom messages     → Telegram delivery
#        • Morning & evening briefs      → Telegram delivery
#        • Background Telegram updates   → Poll/quiz processing
#   3. The same cycle is idempotent: the application's `isCycleRunning` mutex,
#      row-level PostgreSQL claiming, and per-assignment delivery records all
#      prevent duplicates — even if the internal node-cron fires concurrently.
#
# REQUIRED GITHUB CONFIGURATION
#   Secrets  (Settings → Secrets and variables → Actions → Secrets):
#     BOOKS_CRON_SECRET  — Same value as the Render env var BOOKS_CRON_SECRET.
#
#   Variables (Settings → Secrets and variables → Actions → Variables):
#     MOON_APP_URL       — Optional Render app URL; defaults to
#                          https://planner-26cd.onrender.com (no trailing slash).
#
# REQUIRED RENDER CONFIGURATION
#   Environment Variables:
#     BOOKS_CRON_SECRET  — A secure random string (≥ 32 chars). Must match
#                          the GitHub Secret above.
#     DATABASE_URL       — Neon PostgreSQL connection string (already set).
#     TELEGRAM_BOT_TOKEN — Telegram Bot API token (already set).
#     TELEGRAM_CHAT_ID   — Target Telegram channel (already set).
#
# SCHEDULE NOTES
#   • GitHub Actions cron uses UTC. Africa/Addis_Ababa = UTC+3.
#   • The app itself computes all delivery timestamps in UTC internally and
#     compares against `Date.now()`, so UTC triggers are correct.
#   • Runs every 15 minutes to stay within GitHub's free-tier budget (~2,880
#     runs/month) while catching overdue jobs promptly.
#   • GitHub schedule events are best-effort and can be delayed or dropped.
#     Render Cron is the independent primary trigger; this workflow is backup.
# ─────────────────────────────────────────────────────────────────────────────

name: "📚 Book Delivery & Brief Scheduler"

on:
  schedule:
    # ── Staggered 15-minute backup schedule, UTC ────────────────────────────
    # Run at different minute offsets from the independent Render Cron job.
    - cron: "12,27,42,57 * * * *"

  workflow_dispatch:
    # Manual trigger from GitHub UI or API — useful for testing and on-demand
    # delivery of overdue jobs.
    inputs:
      app_url:
        description: "Override App URL. Leave empty to use MOON_APP_URL or the default URL."
        required: false
        type: string
      dry_run:
        description: "Dry run: only wake the service and check health, skip delivery trigger"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  trigger-delivery:
    name: "🚀 Trigger Scheduled Delivery Cycle"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAW_URL: ${{ inputs.app_url || vars.MOON_APP_URL || 'https://planner-26cd.onrender.com' }}
      RAW_SECRET: ${{ secrets.BOOKS_CRON_SECRET }}
    concurrency:
      group: nightplanner-scheduled-delivery
      cancel-in-progress: false

    steps:
      # ────────────────────────────────────────────────────────────────────────
      # 0. Validate configuration
      # ────────────────────────────────────────────────────────────────────────
      - name: "Validate required configuration"
        run: |
          if [ -z "${RAW_SECRET//[[:space:]]/}" ]; then
            echo "::error::BOOKS_CRON_SECRET is required. Add it as a GitHub Actions secret."
            exit 1
          fi

          if [ -z "${RAW_URL//[[:space:]]/}" ]; then
            echo "::error::Application URL is not configured."
            echo "::notice::Set the MOON_APP_URL variable or provide the App URL input when running workflow_dispatch."
            exit 1
          fi

          APP_URL="${RAW_URL%/}"
          echo "APP_URL=${APP_URL}" >> "$GITHUB_ENV"
          echo "Configuration resolved:"
          echo "   App URL: ${APP_URL}"
          echo "   Auth Token: [Configured - Bearer auth will be sent]"
          echo "   Trigger: ${GITHUB_EVENT_NAME}"
          echo "   UTC time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "   EAT time: $(TZ='Africa/Addis_Ababa' date '+%Y-%m-%d %H:%M:%S EAT')"

      # 1. Wake the Render service from cold sleep
      - name: "Wake Render service (health check)"
        id: health
        run: |
          echo "Polling ${APP_URL}/health every 5 seconds for up to 90 seconds..."
          deadline=$((SECONDS + 90))
          HTTP_CODE="000"

          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt_started=$SECONDS
            HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" \
              --max-time 5 \
              "${APP_URL}/health" 2>/dev/null) || HTTP_CODE="000"

            if [[ "$HTTP_CODE" =~ ^2[0-9]{2}$ ]]; then
              echo "Health check HTTP status: ${HTTP_CODE}"
              echo "Service is awake and healthy."
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              if [ -f /tmp/health_response.json ]; then
                echo "Response body:"
                head -c 2000 /tmp/health_response.json
                echo ""
              fi
              exit 0
            fi

            echo "Health check returned HTTP ${HTTP_CODE}; retrying until the 90-second deadline."
            elapsed=$((SECONDS - attempt_started))
            delay=$((5 - elapsed))
            remaining=$((deadline - SECONDS))
            if [ "$delay" -gt "$remaining" ]; then
              delay=$remaining
            fi
            if [ "$delay" -gt 0 ]; then
              sleep "$delay"
            fi
          done

          echo "::error::Health check did not return 2xx within 90 seconds (last HTTP status: ${HTTP_CODE})."
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          exit 1
      # 2. Trigger the delivery cycle
      # ────────────────────────────────────────────────────────────────────────
      - name: "📬 Trigger delivery cycle (POST /api/cron/books)"
        id: deliver
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Triggering delivery cycle at ${APP_URL}/api/cron/books..."
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "EAT: $(TZ='Africa/Addis_Ababa' date '+%Y-%m-%d %H:%M:%S')"
          echo ""

          HTTP_CODE=$(curl -s -o /tmp/cron_response.json -w "%{http_code}" \
            --max-time 300 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${RAW_SECRET}" \
            "${APP_URL}/api/cron/books" 2>/dev/null) || HTTP_CODE="000"

          echo "Delivery trigger HTTP status: ${HTTP_CODE}"
          echo ""

          if [ ! -f /tmp/cron_response.json ]; then
            echo "::error::The delivery endpoint returned no response body."
            exit 1
          fi

          RESPONSE=$(cat /tmp/cron_response.json)
          echo "Response:"
          echo "$RESPONSE" | head -c 4000
          echo ""

          # Parse key metrics from the JSON response
          BOOK_CLAIMED=$(echo "$RESPONSE" | jq -r '.bookJobs.claimed // 0' 2>/dev/null || echo "?")
          BOOK_COMPLETED=$(echo "$RESPONSE" | jq -r '.bookJobs.completed // 0' 2>/dev/null || echo "?")
          BOOK_RETRIED=$(echo "$RESPONSE" | jq -r '.bookJobs.retried // 0' 2>/dev/null || echo "?")
          BOOK_FAILED=$(echo "$RESPONSE" | jq -r '.bookJobs.failed // 0' 2>/dev/null || echo "?")
          MSG_CLAIMED=$(echo "$RESPONSE" | jq -r '.scheduledMessages.claimed // 0' 2>/dev/null || echo "?")
          MSG_COMPLETED=$(echo "$RESPONSE" | jq -r '.scheduledMessages.completed // 0' 2>/dev/null || echo "?")
          MSG_RETRIED=$(echo "$RESPONSE" | jq -r '.scheduledMessages.retried // 0' 2>/dev/null || echo "?")
          MSG_FAILED=$(echo "$RESPONSE" | jq -r '.scheduledMessages.failed // 0' 2>/dev/null || echo "?")
          BRIEFS_COMPLETED=$(echo "$RESPONSE" | jq -r '.briefs.completed // 0' 2>/dev/null || echo "?")
          BRIEFS_RETRIED=$(echo "$RESPONSE" | jq -r '.briefs.retried // 0' 2>/dev/null || echo "?")
          BRIEFS_FAILED=$(echo "$RESPONSE" | jq -r '.briefs.failed // 0' 2>/dev/null || echo "?")
          UNRESOLVED_BOOKS=$(echo "$RESPONSE" | jq -r '.unresolved.bookJobs // 0' 2>/dev/null || echo "?")
          UNRESOLVED_MESSAGES=$(echo "$RESPONSE" | jq -r '.unresolved.scheduledMessages // 0' 2>/dev/null || echo "?")
          UNRESOLVED_BRIEFS=$(echo "$RESPONSE" | jq -r '.unresolved.briefs // 0' 2>/dev/null || echo "?")
          UNCERTAIN_TELEGRAM=$(echo "$RESPONSE" | jq -r '.unresolved.telegramDeliveries // 0' 2>/dev/null || echo "?")
          DURATION=$(echo "$RESPONSE" | jq -r '.durationMs // 0' 2>/dev/null || echo "?")
          AUTO_STATUS=$(echo "$RESPONSE" | jq -r '.automaticPreparation.status // "idle"' 2>/dev/null || echo "?")

          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  📊 DELIVERY CYCLE SUMMARY"
          echo "═══════════════════════════════════════════════════"
          echo "  📚 Book Jobs:     ${BOOK_CLAIMED} claimed → ${BOOK_COMPLETED} completed, ${BOOK_RETRIED} retrying, ${BOOK_FAILED} failed"
          echo "  ✉️  Messages:      ${MSG_CLAIMED} claimed → ${MSG_COMPLETED} completed, ${MSG_RETRIED} retrying, ${MSG_FAILED} failed"
          echo "  🌅 Briefs:        ${BRIEFS_COMPLETED} completed, ${BRIEFS_RETRIED} retrying, ${BRIEFS_FAILED} failed"
          echo "  ⚠️  Unresolved:    ${UNRESOLVED_BOOKS} book jobs, ${UNRESOLVED_MESSAGES} messages, ${UNRESOLVED_BRIEFS} briefs, ${UNCERTAIN_TELEGRAM} uncertain Telegram deliveries"
          echo "  📖 Auto-Prepare:  ${AUTO_STATUS}"
          echo "  ⏱️  Duration:      ${DURATION}ms"
          echo "═══════════════════════════════════════════════════"
          echo ""

          if [ "$HTTP_CODE" -eq 401 ]; then
            echo "::error::Authentication failed (HTTP 401). Verify that BOOKS_CRON_SECRET matches between GitHub Secrets and Render environment variables."
            exit 1
          fi

          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Delivery trigger failed with HTTP ${HTTP_CODE}. Check the response above and the Render logs."
            exit 1
          fi

          if ! jq -e 'type == "object" and has("ok") and (.ok | type == "boolean")' /tmp/cron_response.json >/dev/null; then
            echo "::error::The delivery endpoint returned invalid or incomplete JSON."
            exit 1
          fi

          IS_OK=$(echo "$RESPONSE" | jq -r '.ok // false' 2>/dev/null || echo "false")
          SKIPPED=$(echo "$RESPONSE" | jq -r '.skipped // false' 2>/dev/null || echo "false")

          if [ "$IS_OK" != "true" ]; then
            echo "::error::The scheduler encountered an execution failure during this cycle. Check the response above and the Render logs."
            exit 1
          fi

          if [ "$SKIPPED" = "true" ]; then
            echo "ℹ️ Delivery cycle skipped: another execution cycle was already running (idempotent)."
          else
            echo "✅ Delivery cycle completed successfully."
          fi

      # ────────────────────────────────────────────────────────────────────────
      # 3. Summary annotation for dry runs
      # ────────────────────────────────────────────────────────────────────────
      - name: "📋 Dry run summary"
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          HEALTHY: ${{ steps.health.outputs.healthy }}
        run: |
          echo "ℹ️ Dry run mode: skipped delivery trigger."
          echo "   Service health: ${HEALTHY}"
          echo "   To run a real delivery, trigger the workflow without dry_run."
